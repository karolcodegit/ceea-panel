name: Sync Airtable → Supabase

on:
  push:
    branches:
      - panel
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Airtable → Supabase sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.GATSBY_AIRTABLE_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.GATSBY_AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE: ${{ secrets.GATSBY_AIRTABLE_TABLE_NAME || 'Course' }}
        run: node sync-airtable.js

      - name: Notify success
        if: success()
        run: echo "✅ Synchronizacja zakończona pomyślnie"

      - name: Notify failure
        if: failure()
        run: echo "❌ Synchronizacja nie powiodła się"